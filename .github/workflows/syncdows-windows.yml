name: SyncDows Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/windows/**"
      - "shared/**"
      - "protocol/fixtures/**"
      - ".github/workflows/syncdows-windows.yml"
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "shared/**"
      - "protocol/fixtures/**"
      - ".github/workflows/syncdows-windows.yml"

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"
          cache: gradle

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Test and build branded EXE
        shell: pwsh
        run: .\build-windows.ps1

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: SyncDows-Windows
          path: apps/windows/build/release/*.exe
          if-no-files-found: error
